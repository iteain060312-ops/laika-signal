<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAIKA SIGNAL 운영자 패널</title>
<style>
  :root { --bg:#0b0f1e; --panel:#121833; --line:#26305a; --ink:#e8ecff; --sub:#9aa3c7; --acc:#a8c4ff; --kakao:#fee500; }
  * { box-sizing:border-box; min-width:0; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:28px max(4vw,16px) 80px; }
  h1 { font-size:30px; letter-spacing:-.02em; margin:0 0 6px; }
  .lead { color:var(--sub); margin:0 0 20px; max-width:68ch; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input, select, button { font:inherit; font-size:16px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:9px 12px; min-height:44px; }
  input { flex:1; min-width:180px; }
  button { cursor:pointer; }
  button.pri { background:var(--acc); color:var(--bg); border-color:var(--acc); font-weight:700; }
  button:disabled { opacity:.5; cursor:default; }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  .note { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; color:var(--sub); font-size:14px; margin:16px 0; }
  .note b { color:var(--ink); }
  .users { display:grid; gap:12px; margin-top:16px; }
  .u { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; }
  .tag { display:inline-block; font-size:13px; border-radius:8px; padding:1px 8px; margin-right:6px; }
  .tag.sim { background:#24305e; color:var(--acc); }
  .tag.kakao { background:var(--kakao); color:#191919; }
  .meta { color:var(--sub); font-size:14px; margin-top:4px; overflow-wrap:anywhere; }
  .acts { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .empty { color:var(--sub); padding:24px 0; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#fff; color:#111; padding:10px 16px; border-radius:12px; max-width:min(90vw,560px); opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.on { opacity:1; }
  @media (max-width:640px) { .u { grid-template-columns:minmax(0,1fr); } .acts { justify-content:flex-start; } }
  @media (prefers-reduced-motion:reduce) { .toast { transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>LAIKA SIGNAL 운영자 패널</h1>
  <p class="lead">관객이 일상 속에서 받게 될 신호를 여기서 직접 보내볼 수 있어. 관객이 본 영화를 기준으로, 아직 안 받은 감상 중에서 골라서 보내.</p>

  <form class="row" id="keyForm">
    <input type="password" id="key" placeholder="운영자 비밀번호 (Render의 ADMIN_KEY)" aria-label="운영자 비밀번호" autocomplete="current-password">
    <button class="pri" type="submit">들어가기</button>
  </form>

  <div class="note">
    <b>시뮬레이터 관객</b>은 버튼을 누르면 몇 초 안에 채팅에 바로 떠.<br>
    <b>카카오톡 관객</b>은 챗봇이 먼저 말을 걸 수 없어서, 그 관객이 <b>아무 말이나 한 번 보내면</b> 그때 도착해.
  </div>

  <div class="row">
    <label for="delay" style="color:var(--sub);font-size:14px">도착 시점</label>
    <select id="delay">
      <option value="0">지금 바로</option>
      <option value="10">10초 뒤</option>
      <option value="60">1분 뒤</option>
      <option value="300">5분 뒤</option>
    </select>
    <a href="/" target="_blank" rel="noopener" style="color:var(--acc);margin-left:auto">시뮬레이터 새 창으로 열기 ↗</a>
  </div>

  <div class="users" id="users"><p class="empty">비밀번호를 넣으면 관객 목록이 나와.</p></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
{
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let key = '';
try { key = sessionStorage.getItem('laika-admin') || ''; } catch (e) {}
$('key').value = key;

let tt = null;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 3200); }

function ago(ms) {
  if (!ms) return '기록 없음';
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return '방금 전';
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  return Math.floor(s / 86400) + '일 전';
}

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-key': key, ...(opts.headers || {}) } });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || '오류가 났어요');
  return d;
}

async function load() {
  if (!key) return;
  try {
    const users = await api('/api/admin/users');
    $('users').innerHTML = users.length ? users.map((u) => `
      <div class="u">
        <div>
          <span class="tag ${u.channel === 'kakao' ? 'kakao' : 'sim'}">${u.channel === 'kakao' ? '카카오톡' : '시뮬레이터'}</span>
          <b>${u.movie ? '《' + esc(u.movie) + '》' : '아직 관람 전'}</b>
          <div class="meta">마지막 대화 ${ago(u.lastSeenAt)} · 보낸 신호 ${u.sent}개 · 도착 대기 ${u.waiting}개${u.muted.length ? ' · 그만 받기: ' + u.muted.map(esc).join(', ') : ''}<br>ID ${esc(u.id.slice(0, 18))}${u.id.length > 18 ? '…' : ''}</div>
        </div>
        <div class="acts">
          <button type="button" data-id="${esc(u.id)}" data-r="similar" ${u.movie ? '' : 'disabled'}>비슷한 신호</button>
          <button type="button" data-id="${esc(u.id)}" data-r="different" ${u.movie ? '' : 'disabled'}>다른 신호</button>
          <button type="button" data-id="${esc(u.id)}" data-r="like" ${u.sent ? '' : 'disabled'}>♥ 좋아요 받기</button>
        </div>
      </div>`).join('') : '<p class="empty">아직 대화한 관객이 없어. 시뮬레이터나 카톡에서 먼저 말을 걸어봐.</p>';
  } catch (e) {
    $('users').innerHTML = `<p class="empty">${esc(e.message)}</p>`;
  }
}

$('keyForm').addEventListener('submit', (e) => {
  e.preventDefault();
  key = $('key').value.trim();
  try { sessionStorage.setItem('laika-admin', key); } catch (err) {}
  load();
});

$('users').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-r]'); if (!b) return;
  b.disabled = true;
  try {
    const r = await api('/api/admin/send', { method: 'POST', body: JSON.stringify({ userId: b.dataset.id, relation: b.dataset.r, delaySec: +$('delay').value }) });
    if (!r.ok) toast(r.reason);
    else toast(b.dataset.r === 'like' ? `《${r.movie}》 신호에 좋아요를 보냈어요` : `보냈어요: “${(r.preview || '').slice(0, 40)}${(r.preview || '').length > 40 ? '…' : ''}”`);
    load();
  } catch (err) { toast(err.message); }
  b.disabled = false;
});

load();
setInterval(load, 5000);
}
</script>
</body>
</html>
